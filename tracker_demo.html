<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tracker Demo</title>
        <script
            id="tracker-script"
            src="/tracker.js"
            data-site-id="demo-site"
            defer
        ></script>
        <style>
            body {
                background-color: #090d16;
                color: #d1d5db;
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    monospace;
                padding: 20px;
                font-size: 13px;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                border-bottom: 1px solid #1f2937;
                padding-bottom: 10px;
            }

            h1 {
                font-size: 16px;
                color: #f3f4f6;
                font-weight: normal;
            }

            .controls {
                display: flex;
                gap: 15px;
                margin-bottom: 15px;
                align-items: center;
                flex-wrap: wrap;
            }

            .control-group {
                display: flex;
                align-items: center;
                gap: 5px;
            }

            select,
            input {
                background-color: #111827;
                border: 1px solid #374151;
                color: #f3f4f6;
                padding: 4px 8px;
                font-family: inherit;
                font-size: 12px;
                outline: none;
            }

            button {
                background-color: #1f2937;
                border: 1px solid #374151;
                color: #f3f4f6;
                padding: 5px 12px;
                cursor: pointer;
                font-family: inherit;
                font-size: 12px;
            }

            button:hover {
                background-color: #374151;
            }

            .actions {
                margin-bottom: 20px;
                display: flex;
                gap: 8px;
            }

            .console {
                background-color: #020617;
                border: 1px solid #1f2937;
                padding: 15px;
                height: 450px;
                overflow-y: auto;
                line-height: 1.6;
            }

            .line {
                margin-bottom: 4px;
                white-space: pre-wrap;
            }

            .text-time {
                color: #6b7280;
            }
            .text-track {
                color: #f59e0b;
            }
            .text-ingest {
                color: #10b981;
            }
            .text-system {
                color: #3b82f6;
            }

            .nav-link {
                display: inline-block;
                margin-top: 15px;
                color: #9ca3af;
                text-decoration: none;
            }

            .nav-link:hover {
                color: #f3f4f6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Event Tracker</h1>
                <a href="/" class="nav-link" style="margin-top: 0"
                    >Back to Dashboard</a
                >
            </header>

            <div class="controls">
                <div class="control-group">
                    <span>User ID:</span>
                    <input
                        type="number"
                        id="input-userid"
                        placeholder="Auto"
                        style="width: 70px"
                    />
                </div>
            </div>

            <div class="actions">
                <button data-event="view" data-target="19896" data-category="9">
                    Simulate View
                </button>
                <button
                    data-event="scroll"
                    data-target="4682"
                    data-category="18"
                    data-duration="15"
                >
                    Simulate Scroll
                </button>
                <button
                    data-event="click"
                    data-target="33265"
                    data-category="9"
                    data-liked="true"
                >
                    Simulate Like
                </button>
                <button
                    data-event="share"
                    data-target="14399"
                    data-category="13"
                >
                    Simulate Share
                </button>
            </div>

            <div class="console" id="log-console">
                <div class="line text-system">
                    Console initialized. Click simulate buttons to generate
                    activity.
                </div>
            </div>
        </div>

        <script>
            function appendLog(type, message) {
                const consoleBox = document.getElementById("log-console");
                const time = new Date().toLocaleTimeString();

                let colorClass = "text-system";
                if (type === "track") colorClass = "text-track";
                else if (type === "ingest") colorClass = "text-ingest";

                const line = document.createElement("div");
                line.className = `line ${colorClass}`;
                line.innerHTML = `<span class="text-time">[${time}]</span> [${type.toUpperCase()}] ${message}`;

                consoleBox.appendChild(line);
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }

            window.addEventListener("tracker:track", (e) => {
                const ev = e.detail.event;
                appendLog(
                    "track",
                    `Captured "${ev.event_type}" (target: ${ev.target_id}, category: ${ev.category_id}, user_id: ${ev.user_id})`,
                );
            });

            window.addEventListener("tracker:ingested", (e) => {
                const ev = e.detail.event;
                const data = e.detail.data;
                const pg = data.timings_ms.postgres;
                const ch = data.timings_ms.clickhouse;
                const speedup = data.timings_ms.speedup;
                const winner =
                    speedup >= 1
                        ? `ClickHouse (${speedup.toFixed(2)}x)`
                        : `PostgreSQL (${(1 / speedup).toFixed(2)}x)`;

                appendLog(
                    "ingest",
                    `Ingested "${ev.event_type}" | PG: ${pg.toFixed(1)}ms | CH: ${ch.toFixed(1)}ms | Winner: ${winner}`,
                );
            });

            let debounceTimer = null;
            document
                .getElementById("input-userid")
                .addEventListener("input", (e) => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const userId = e.target.value.trim();
                        const trackerScript =
                            document.getElementById("tracker-script");
                        if (trackerScript) {
                            if (userId) {
                                trackerScript.setAttribute(
                                    "data-user-id",
                                    userId,
                                );
                            } else {
                                trackerScript.removeAttribute("data-user-id");
                            }
                            appendLog(
                                "system",
                                `User ID updated to: ${userId || "Auto (Session)"}`,
                            );
                        }
                    }, 500);
                });
        </script>
    </body>
</html>
