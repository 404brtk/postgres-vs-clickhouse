on:
    push:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - "Dockerfile"
            - "docker-compose.yml"
            - ".github/workflows/security.yml"
    pull_request:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - "Dockerfile"
            - "docker-compose.yml"
            - ".github/workflows/security.yml"

jobs:
    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  exit-code: "1"
                  severity: "HIGH,CRITICAL"
