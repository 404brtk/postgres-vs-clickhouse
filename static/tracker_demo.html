<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tracker Demo</title>
        <script
            src="/static/tracker.js"
            data-endpoint="/api/analytics/ingest"
            defer
        ></script>
        <link rel="stylesheet" href="/static/style.css" />
        <script src="/static/console.js"></script>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Event Tracker</h1>
                <div class="nav-links">
                    <a href="/" class="nav-link">Analytics Console</a>
                </div>
            </header>

            <div class="actions">
                <button data-event="view" data-target-id="19896" data-category-id="9">
                    Simulate View
                </button>
                <button
                    data-event="scroll"
                    data-target-id="4682"
                    data-category-id="18"
                    data-scroll-depth="75"
                >
                    Simulate Scroll
                </button>
                <button
                    data-event="click"
                    data-target-id="33265"
                    data-category-id="9"
                    data-is-liked="true"
                >
                    Simulate Like
                </button>
                <button
                    data-event="share"
                    data-target-id="14399"
                    data-category-id="13"
                >
                    Simulate Share
                </button>
            </div>

            <div class="terminal demo-terminal" id="terminal">
                <div class="terminal-init-message">
                    Console initialized. Click simulate buttons to generate
                    activity.
                </div>
            </div>
        </div>

        <script>
            window.addEventListener("tracker:track", (e) => {
                const ev = e.detail.event;
                const standardKeys = [
                    "event_type",
                    "target_id",
                    "category_id",
                    "duration_sec",
                    "is_liked",
                    "device",
                    "pathname",
                    "referrer",
                    "commission",
                ];
                const customProps = [];
                for (const [key, value] of Object.entries(ev)) {
                    if (!standardKeys.includes(key)) {
                        customProps.push(`${key}: ${value}`);
                    }
                }
                const customStr = customProps.length
                    ? `, properties: {${customProps.join(", ")}}`
                    : "";
                const duration = ev.duration_sec
                    ? `, duration: ${ev.duration_sec}s`
                    : "";
                log(
                    `[TRACK] Captured "${ev.event_type}" (target: ${ev.target_id}, category: ${ev.category_id}${duration}${customStr}, page: ${ev.pathname})`,
                );
            });

            window.addEventListener("tracker:ingested", (e) => {
                const ev = e.detail.event;
                const data = e.detail.data;
                const ch = data.timings_ms.clickhouse;
                const chStr = ch != null ? `${ch.toFixed(1)}ms` : "failed";

                log(`[INGEST] Ingested "${ev.event_type}" | CH: ${chStr}`);
            });
        </script>
    </body>
</html>
