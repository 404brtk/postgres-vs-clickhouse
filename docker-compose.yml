services:
    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: clickhouse
        restart: unless-stopped
        environment:
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
        ports:
            - "${CLICKHOUSE_PORT:-8123}:8123"
            - "9000:9000"
        volumes:
            - chdata:/var/lib/clickhouse
        healthcheck:
            test:
                [
                    "CMD",
                    "clickhouse-client",
                    "--password",
                    "${CLICKHOUSE_PASSWORD:-clickhouse_password}",
                    "--query",
                    "SELECT 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: .
        container_name: analytics_app
        restart: unless-stopped
        profiles:
            - fastapi
        ports:
            - "8000:8000"
        environment:
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 8123
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
            ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-demo-api-key}
            AUTH_DISABLED: ${AUTH_DISABLED:-false}
        depends_on:
            clickhouse:
                condition: service_healthy

    clickhouse-backup:
        image: altinity/clickhouse-backup:latest
        container_name: clickhouse_backup
        restart: unless-stopped
        command:
            - server
        profiles:
            - backup
        environment:
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-default}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
            REMOTE_STORAGE: s3
            S3_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
            S3_BUCKET: ${R2_BUCKET_NAME}
            S3_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
            S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
            S3_ACL: ""
            S3_FORCE_PATH_STYLE: "true"
            S3_REGION: auto
            S3_COMPRESSION_FORMAT: zstd
            S3_COMPRESSION_LEVEL: 3
            BACKUPS_TO_KEEP_LOCAL: 0
            # WATCH_SCHEDULES: "name=monthly,full=0 0 1 * *,increment=0 2 * * *"
        volumes:
            - chdata:/var/lib/clickhouse
        depends_on:
            clickhouse:
                condition: service_healthy

volumes:
    chdata:
