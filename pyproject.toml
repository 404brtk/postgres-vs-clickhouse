[project]
name = "postgres-vs-clickhouse"
version = "0.1.0"
description = "postgres-vs-clickhouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=1.4.1",
    "fastapi>=0.139.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.50.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"routers/analytics.py" = ["S608"]
