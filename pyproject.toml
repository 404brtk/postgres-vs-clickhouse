[project]
name = "postgres-vs-clickhouse"
version = "0.1.0"
description = "postgres-vs-clickhouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "clickhouse-connect>=1.4.1",
    "fastapi>=0.139.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.50.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
